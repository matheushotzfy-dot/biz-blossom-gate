# HOTZFY — Security headers para Nginx (VPS)
# Aplique dentro do bloco `server { ... }` que serve hotzfy.com.br
# Headers que NÃO podem ser definidos via <meta http-equiv> (precisam ser HTTP reais):
#   - Strict-Transport-Security (HSTS)
#   - X-Frame-Options
#   - X-Content-Type-Options (também via meta, mas redundância é ok)
#   - Referrer-Policy
#   - Permissions-Policy

# Use `always` para que os headers apareçam também em respostas de erro (4xx/5xx).

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-XSS-Protection "0" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# Opcional: também forçar HTTPS (redirect 80 -> 443) em outro bloco server.

# Após aplicar: `nginx -t && systemctl reload nginx`
# Validar em: https://securityheaders.com/?q=hotzfy.com.br
